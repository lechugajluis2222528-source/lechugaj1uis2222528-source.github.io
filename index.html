
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Venadito Hidalguense | Taller de Reparación de Armas</title>

    <!-- ICONOS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #060907;
            color: white;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: #060907;
            border-bottom: 2px solid #00ff66;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            color: #00ff66;
            font-weight: bold;
        }

        .contenido {
            max-width: 800px;
            margin: 100px auto;
            padding: 20px;
        }

        .caja {
            background: #0d1410;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #00ff66;
        }

        select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            background: #25d366;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
        }

        button:hover {
            background: #1fb85c;
        }

        .resumen {
            margin-top: 20px;
            padding: 15px;
            border: 1px dashed #00ff66;
        }
    </style>
</head>

<body>

<nav>
    <div class="logo">EL VENADITO HIDALGUENSE</div>
</nav>

<div class="contenido">

    <div class="caja">

        <h2>Formulario de Cotización</h2>

        <label>Tipo de arma</label>
        <select id="tipoArma" onchange="actualizar()">
            <option>Arma de Fuego (Pistola / Escuadra)</option>
            <option>Arma de Fuego (Revólver)</option>
            <option>Arma de Fuego (Rifle / Escopeta)</option>
            <option>Arma de Gas / CO2 (Pistola)</option>
        </select>

        <label>Servicio</label>
        <select id="tipoServicio" onchange="actualizar()">
            <option>Limpieza completa</option>
            <option>Reparación de falla</option>
            <option>Restauración</option>
            <option>Cambio de piezas</option>
        </select>

        <label>Detalles</label>
        <textarea id="detalles" oninput="actualizar()" placeholder="Describe la falla..."></textarea>

        <div class="resumen">
            <p><b>Arma:</b> <span id="rArma"></span></p>
            <p><b>Servicio:</b> <span id="rServicio"></span></p>
            <p><b>Detalles:</b> <span id="rDetalles"></span></p>
        </div>

        <button onclick="mandarWhatsApp()">
            Enviar cotización por WhatsApp
        </button>

    </div>

</div>

<script>
    function actualizar() {
        document.getElementById('rArma').innerText = document.getElementById('tipoArma').value;
        document.getElementById('rServicio').innerText = document.getElementById('tipoServicio').value;

        let det = document.getElementById('detalles').value;
        document.getElementById('rDetalles').innerText = det ? det : "Ninguna";
    }

    function mandarWhatsApp() {

        let arma = document.getElementById('rArma').innerText;
        let servicio = document.getElementById('rServicio').innerText;
        let detalles = document.getElementById('rDetalles').innerText;

        let mensaje =
`Hola El Venadito Hidalguense, quiero una cotización:

• Tipo de arma: ${arma}
• Servicio: ${servicio}
• Detalles: ${detalles}

Gracias`;

        let url = "https://wa.me/527717016055?text=" + encodeURIComponent(mensaje);

        window.open(url, '_blank');
    }

    // inicializar
    actualizar();
</script>

</body>
</html>
